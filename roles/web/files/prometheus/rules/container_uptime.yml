groups:
  - name: container_uptime
    interval: 1m
    rules:
      - record: container_up_bool
        expr: |
          max by (name) (container_last_seen{name!="",name!="/"} > bool (time() - 90))
          or
          max by (name) (max_over_time(container_last_seen{name!="",name!="/"}[1d])) * 0
