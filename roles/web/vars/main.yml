---
  web_containers:
    - traefik
    - prometheus
    - registry
    - authelia
    - grafana
    - minecraft
    - timescale
    - photoprism
    - loki
    - promtail
    - postgres_exporter
    - conduit
    - picoclaw
    - code-server
    - coturn
    - rendezvous
    - otterwiki
    - alertmanager
    - matrix_receiver
    - sql_exporter
  conduit:
    domain: "matrix.{{ topleveldomain }}"
    port: 6167
  registry:
    domain: "registry.{{ topleveldomain }}"
    port: 5000
  prometheus:
    domain: "metrics.{{ topleveldomain }}"
  alertmanager:
    domain: "alerts.{{ topleveldomain }}"
    port: 9093
  matrix_receiver:
    port: 12345
  sql_exporter:
    port: 9399
  authelia:
    image: authelia/authelia:4.39.28
    domain: "auth.{{ topleveldomain }}"
    port: 9091
  traefik:
    domain: "proxy.{{ topleveldomain }}"
  grafana:
    domain: "graph.{{ topleveldomain }}"
  minecraft:
    port: 25565
  cadvisor:
    domain: "cadvisor.{{ topleveldomain }}"
  photoprism:
    domain: "photos.{{ topleveldomain }}"
  redirect:
    domains:
      - "me.{{ topleveldomain }}"
      - "christian.sterzl.info"
    target: "https://www.linkedin.com/in/christian-sterzl-59b282182/"
    apex_target: "https://christian.sterzl.info"

  picoclaw:
    domain: "picoclaw.{{ topleveldomain }}"
    port: 18800

  picoclaw_gw:
    domain: "picoclaw-gw.{{ topleveldomain }}"
    port: 18790

  code_server:
    domain: "code.{{ topleveldomain }}"
    port: 8443

  android_sdk:
    cmdline_tools_version: "11076708"
    packages:
      - "platform-tools"
      - "platforms;android-35"
      - "platforms;android-36"
      - "build-tools;36.0.0"

  expo:
    domain: "expo.{{ topleveldomain }}"
    port: 8081

  coturn:
    domain: "turn.{{ topleveldomain }}"
    # STUN/TURN listener and the TLS (turns:) listener.
    port: 3478
    tls_port: 5349
    # Relay port range. Host networking means nothing has to be published,
    # but the UDP range must be reachable from the internet.
    min_port: 49152
    max_port: 49200
    # Long-term credential handed to the game clients.
    user: hhfh
    # Terminate turns:// on 5349 using the Let's Encrypt cert Traefik holds.
    # Set to false to run plaintext STUN/TURN only (no cert plumbing needed).
    tls: yes
    # Set when the box is behind NAT and coturn must advertise a different
    # address than the one on its interface: "PUBLIC_IP/PRIVATE_IP".
    external_ip: ""
    # The single address coturn binds and relays on. Empty means every
    # interface, which under host networking includes the Docker bridges.
    listening_ip: "{{ vault_server_ip }}"
    quota:
      user: 12
      total: 1200

  rendezvous:
    domain: "hhfh.{{ topleveldomain }}"
    port: 8787
    # A session is two SDP blobs waiting for the second phone; ten minutes is
    # far longer than the pairing actually takes.
    session_ttl_ms: 600000

  # SSH wrapped in TLS on port 443, for networks that block port 22. Traefik
  # terminates the TLS and hands the plain SSH stream to the host's sshd.
  ssh_tunnel:
    domain: "ssh.{{ topleveldomain }}"
    # The host as seen from Traefik: the gateway of web_proxy (subnet
    # 172.20.0.0/24 in docker-compose_yml.j2). sshd listens on all addresses.
    target: "172.20.0.1:22"

  otterwiki:
    domain: "wiki.{{ topleveldomain }}"
    site_name: "Wiki"
    # Authelia groups, used both by the Authelia access rules and by
    # Otterwiki's role mapping. Admins get every permission; users may read,
    # edit and upload attachments.
    admin_group: WIKI_ADMIN
    user_group: WIKI_USER
    # nginx client_max_body_size inside the container, caps attachment uploads.
    max_upload: 50M
    # Private repository that receives every wiki change, as an off-server
    # copy, and whose changes are pulled back by a GitHub push webhook. Both
    # use the read-write deploy key in vault_otterwiki_push_private_key.
    # Changing the URL (or SECRET_KEY) changes the webhook address; see
    # Otterwiki in ARCHITECTURE.md.
    remote_url: "git@github.com:Waxolunist/wiki.git"

  # Groups allowed onto every other Authelia-protected service. Anyone in none
  # of these (e.g. a wiki-only user) gets nothing but the wiki.
  authelia_full_access_groups:
    - admins
    - Viewer

  # compose runs with recreate: never, so a changed image, label or
  # environment would otherwise never reach a running container. These
  # services are recreated whenever their compose definition changed;
  # unchanged ones are left alone.
  recreate_when_changed:
    - reverse-proxy
    - authelia
    - otterwiki
    - grafana-pg
    - grafana
    - alertmanager
    - matrix-receiver
    - sql-exporter
    - cadvisor
    - node-exporter
    - registry

  restart_container: no

  alerting:
    areas:
      - infra
      - data
      - energy
      - car
      - security
    group_by:
      - "..."
    repeat_interval:
      critical: 1h
      warning: 12h
      info: 8760h
    grafana_url: "https://{{ grafana.domain }}"
    runbook_url: "https://github.com/Waxolunist/home_docs/blob/main/how-to"
    collector_target: "10.8.0.2:9105"
    pi_node_target: "10.8.0.2:9100"
    pi_cadvisor_target: "10.8.0.2:8081"
    pi_traefik_target: "10.8.0.2:8082"
    scrape_jobs:
      - prometheus
      - docker
      - registry
      - traefik
      - node-metrics
      - cadvisor
      - authelia
      - postgres_exporter
      - coturn
      - alertmanager
      - matrix_receiver
      - sql_exporter
    memory_available_min_ratio: 0.1
    swap_used_max_bytes: 2147483648
    swap_used_max_ratio: 0.6
    pi_temperature_max_celsius: 80
    collector_job_stale_after:
      PsaHealthJob: 15m
      VehicleInfoJob: 30m
      GoEEnergyJob: 30m
      ChargingControlJob: 30m
      ChargingModeJob: 30m
      SohInfoJob: 30m
      SolarInfoJob: 30m
      GoeSignaller: 1h
      SmartmeterInfoJob: 3h
      SpotDataJob: 3h
      GasolineJob: 3h
      VehicleTripsJob: 3h
    data_tables:
      - table: data_power_live
        column: time
        stale_after: 10m
        dashboard: cekyf6g8gyupse
      - table: data_solar_power
        column: time
        stale_after: 30m
        dashboard: cekyf6g8gyupse
      - table: data_solar_energy
        column: time
        stale_after: 30m
        dashboard: cekyf6g8gyupse
      - table: data_battery_stats
        column: time
        stale_after: 30m
        dashboard: cekyf6g8gyupse
      - table: data_goe_status_eto
        column: time
        stale_after: 30m
        dashboard: chw95zv
      - table: data_vehicle_energy_level
        column: time
        stale_after: 30m
        dashboard: ch6qwwl
      - table: data_vehicle_battery_soh
        column: time
        stale_after: 30m
        dashboard: ch6qwwl
      - table: data_smartmeter_energy
        column: time
        stale_after: 48h
        dashboard: energy-contract-prices
      - table: data_gasprices
        column: time
        stale_after: 48h
        dashboard: energy-contract-prices
      - table: data_spotdata
        column: start_timestamp
        stale_after: -4h
        dashboard: energy-contract-prices
        description: "The spot prices run out in less than 4 hours, so tomorrow's prices have not arrived."

  # Where the circles of the energy flow panel link to. Any Grafana path or URL.
  grafana_flow_links:
    pv: /d/cekyf6g8gyupse
    grid: /d/del1obdfglfy8f
    battery: /d/cekyf6g8gyupse
    household: /d/bekag75iz9on4e
    wallbox: /d/chw95zv
    car: /d/ch6qwwl
