---
  - name: PicoClaw - Write configuration
    template:
      src: picoclaw/config_json.j2
      dest: "{{ docker.paths.data }}picoclaw/config.json"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: 0600
      backup: yes
    become: yes
    register: picoclaw_config

  - name: PicoClaw - Write security configuration
    template:
      src: picoclaw/security_yml.j2
      dest: "{{ docker.paths.data }}picoclaw/.security.yml"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: 0600
      backup: yes
    become: yes
    register: picoclaw_security

  - name: PicoClaw - Set data directory ownership
    file:
      path: "{{ docker.paths.data }}picoclaw"
      state: directory
      owner: root
      group: root
      mode: '0755'
    become: yes

  - name: PicoClaw - Create the Legacy Radar workspace
    file:
      path: "{{ docker.paths.data }}picoclaw/workspace/legacy-radar/{{ item }}"
      state: directory
      owner: root
      group: root
      mode: '0755'
    loop:
      - ""
      - reports
      - state
    become: yes

  - name: PicoClaw - Copy the Legacy Radar agent, skill and scripts
    copy:
      src: picoclaw/legacy-radar/
      dest: "{{ docker.paths.data }}picoclaw/workspace/legacy-radar/"
      owner: root
      group: root
      mode: preserve
    become: yes
    register: picoclaw_legacy_radar

  - name: PicoClaw - Write the wiki host for the Legacy Radar digest
    copy:
      content: "{{ otterwiki.domain }}\n"
      dest: "{{ docker.paths.data }}picoclaw/workspace/legacy-radar/wiki_host"
      owner: root
      group: root
      mode: '0644'
    become: yes

  - name: PicoClaw - Write the Legacy Radar publish scripts
    copy:
      src: "{{ item }}"
      dest: "{{ docker_base_path }}/{{ item }}"
      mode: "{{ '0755' if item.endswith('.sh') else '0644' }}"
    loop:
      - legacy_radar_publish.sh
      - legacy_radar_publish.py

  - name: PicoClaw - Publish Legacy Radar reports to Otterwiki every 15 minutes
    cron:
      name: "legacy radar publish"
      minute: "*/15"
      user: "{{ ansible_user }}"
      job: "{{ docker_base_path }}/legacy_radar_publish.sh >> {{ docker.paths.logs }}legacy_radar_publish.log 2>&1"
