---
  - name: Create directory
    file:
      path: web/
      state: directory
  - name: Create config dirs
    file:
      path: "{{ docker.paths.configs }}{{ item }}"
      state: directory
    loop: "{{ web_containers }}"
  - name: Create work dirs
    file:
      path: "{{ docker.paths.work }}{{ item }}"
      state: directory
    loop: "{{ web_containers }}"
  - name: Create log dirs
    file:
      path: "{{ docker.paths.logs }}{{ item }}"
      state: directory
    loop: "{{ web_containers }}"
  - name: Create data dirs
    file:
      path: "{{ docker.paths.data }}{{ item }}"
      state: directory
    loop: "{{ web_containers }}"
  - name: Create secrets directory
    file:
      path: "{{ docker_base_path }}/secrets"
      state: directory
      mode: '0700'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Run web container specific tasks
    include_tasks: "{{ container_name }}.yml"
    loop: "{{ web_containers }}"
    loop_control:
      loop_var: container_name
  # A static import, unlike the loop above, passes its tag to every task
  # inside, so --tags grafana_dashboards runs just these and skips the rest.
  - import_tasks: grafana_dashboards.yml
    when: "'grafana' in web_containers"
    tags: grafana_dashboards
  - name: Write docker compose file
    template:
      src: docker-compose_yml.j2
      dest: "{{ docker_base_path }}/docker-compose.yml"
      mode: 0644
      backup: yes
  - name: Create restart script
    template:
      src: start_sh.j2.sh
      dest: "{{ docker_base_path }}/start.sh"
      mode: 0755
      backup: yes
  - name: Add cronjob to restart docker if neccessary
    cron:
      name: "check docker containers"
      minute: "*/5"
      user: "{{ ansible_user }}"
      backup: yes
      job: "{{ docker_base_path }}/start.sh >> {{ docker.paths.logs }}start.log 2>&1"
  - name: Create backup file
    template:
      src: backup_databases.j2.sh
      dest: "{{ docker_base_path }}/backup_databases.sh"
      mode: 0755
      backup: yes
  - name: Create restore script
    template:
      src: restore_grafana.j2.sh
      dest: "{{ docker_base_path }}/restore_grafana.sh"
      mode: 0755
      backup: yes
  - name: Create TimescaleDB restore script
    template:
      src: restore_timescale.j2.sh
      dest: "{{ docker_base_path }}/restore_timescale.sh"
      mode: 0750
      backup: yes
  - name: Add cronjob for backup job
    cron:
      name: "backup databases"
      minute: "0"
      hour: "23"
      user: "{{ ansible_user }}"
      backup: yes
      job: "{{ docker_base_path }}/backup_databases.sh >> {{ docker.paths.logs }}backup.log 2>&1"
  - name: Create node_exporter textfile collector directory
    file:
      path: "{{ docker.paths.data }}node-exporter"
      state: directory
      mode: '0755'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
    become: yes
  - name: Install logrotate config for docker container logs
    template:
      src: logrotate_docker.j2
      dest: /etc/logrotate.d/docker-containers
      mode: 0644
      owner: root
      group: root
    become: yes
  - name: Run docker-compose
    block:
      - name: Find docker compose files
        find:
          paths: "{{ docker_base_path }}"
          patterns: 'docker-compose*.yml'
          recurse: no
        register: compose_files
      - community.docker.docker_compose_v2:
          project_src: "{{ docker_base_path }}"
          state: present
          recreate: "{{ 'always' if restart_container else 'never' }}"
          files: "{{ compose_files.files | map(attribute='path') | list }}"
          remove_orphans: true
        register: compose_output
      - debug:
          var: compose_output
      #- name: Deploy stack from a compose file
      #  community.general.docker_stack:
      #    state: present
      #    name: default
      #    compose: "{{ compose_files.files | map(attribute='path') | list }}"
      #  register: stack_output
      # - docker_compose:
      #    project_src: "{{ docker_base_path }}"
      #    state: present
      #    restarted: "{{ restart_container }}"
      #    files: "{{ compose_files.files | map(attribute='path') | list }}"
      #  register: compose_output
      #- debug:
      #    var: stack_output
  
  # traefik.yml is static configuration -- Traefik reads it once at startup, so
  # a change there (adding the file provider, entrypoints, resolvers) needs a
  # restart. Files under configs/traefik/dynamic are watched and hot-reloaded,
  # and never reach this task.
  - name: Restart Traefik when its static configuration changed
    command: docker restart web_reverse-proxy
    become: yes
    when: traefik_static_config is defined and traefik_static_config.changed

  # turnserver.conf is read once at startup. compose runs with recreate: never,
  # so a config-only change would otherwise sit on disk unapplied.
  - name: Coturn - Restart when its configuration changed
    command: docker restart web_coturn
    become: yes
    when: coturn_config is defined and coturn_config.changed

  # server.js is read once at startup and compose runs with recreate: never,
  # so a new version would otherwise sit on disk unused.
  - name: Rendezvous - Restart when the server source changed
    command: docker restart web_rendezvous
    become: yes
    when: rendezvous_source is defined and rendezvous_source.changed

  # Without --force-recreate, compose only recreates a service whose config
  # hash differs from the running container's, so this is a no-op unless
  # something actually changed.
  - name: Recreate services whose compose definition changed
    command: >-
      docker compose
      {% for file in compose_files.files | map(attribute='path') %}-f {{ file }} {% endfor %}
      up -d --no-deps {{ recreate_when_changed | join(' ') }}
    args:
      chdir: "{{ docker_base_path }}"
    become: yes
    register: recreated_services
    changed_when: "'Recreated' in recreated_services.stderr"
    when: not restart_container

  # Tagged so a dashboards-only run still applies a changed provider.
  - name: Grafana - Restart when its configuration changed
    command: docker restart web_grafana
    become: yes
    when: >-
      (grafana_config is defined and grafana_config.changed) or
      (grafana_goe_datasource is defined and grafana_goe_datasource.changed) or
      (grafana_dashboard_provider is defined and grafana_dashboard_provider.changed) or
      (grafana_alerting is defined and grafana_alerting.changed)
    tags: grafana_dashboards

  # Authelia reads its configuration once at startup. compose runs with
  # recreate: never, so access rule changes would otherwise sit on disk
  # unapplied. The users database is watched and needs no restart.
  - name: Authelia - Restart when its configuration changed
    command: docker restart authelia
    become: yes
    when: authelia_config is defined and authelia_config.changed

  # settings.cfg is read once at startup.
  - name: Otterwiki - Restart when its settings changed
    command: docker restart web_otterwiki
    become: yes
    when: otterwiki_config is defined and otterwiki_config.changed

  # recreate: never means compose will not attach the already running Traefik
  # to the newly declared wiki network. Connecting it directly gives the same
  # end state without restarting the proxy for every other service.
  - name: Otterwiki - Attach Traefik to the wiki network
    command: docker network connect web_wiki web_reverse-proxy
    become: yes
    register: traefik_wiki_network
    changed_when: traefik_wiki_network.rc == 0
    failed_when: traefik_wiki_network.rc != 0 and 'already exists' not in traefik_wiki_network.stderr

  # First run only: Traefik has just been told about turn-cert and needs a
  # moment to complete the ACME challenge, so the pre-compose dump found
  # nothing. Retry here and restart coturn once the certificate lands.
  - name: Coturn - Dump the TLS certificate after Traefik has issued it
    command: "{{ docker_base_path }}/dump_coturn_certs.sh"
    become: yes
    register: coturn_cert_dump_post
    changed_when: "'updated' in coturn_cert_dump_post.stdout"
    failed_when: false
    until: coturn_cert_dump_post.rc == 0
    retries: 10
    delay: 15
    when: coturn.tls

  # Only Ansible's own backup names (<file>.<pid>.<YYYY-MM-DD@HH:MM:SS>~):
  # data/ holds application files too, such as editor backups in the
  # code-server workspace, which a plain '*~' would delete. become is needed
  # for backups of files written as root (e.g. picoclaw's config).
  - name: Find Ansible template backup files
    find:
      paths:
        - "{{ docker_base_path }}"
      patterns: '^.+\.\d+\.\d{4}-\d{2}-\d{2}@\d{2}:\d{2}:\d{2}~$'
      use_regex: yes
      recurse: yes
      # Backups of dotfiles such as picoclaw's .security.yml are hidden too.
      hidden: yes
    become: yes
    register: ansible_backups

  - name: Remove old Ansible template backups (keep newest 20)
    file:
      path: "{{ item.path }}"
      state: absent
    become: yes
    loop: "{{ (ansible_backups.files | sort(attribute='mtime', reverse=true))[20:] }}"
    loop_control:
      label: "{{ item.path }}"