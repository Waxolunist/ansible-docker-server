---
  - name: Setup model - Install the page
    copy:
      src: setup_model/setup-model.html
      dest: "{{ docker.paths.configs }}setup_model/index.html"
      mode: 0644

  - name: Setup model - Keep crawlers away
    copy:
      content: |
        User-agent: *
        Disallow: /
      dest: "{{ docker.paths.configs }}setup_model/robots.txt"
      mode: 0644
