---
  - name: Grafana - Write grafana_pg_password secret
    copy:
      content: "{{ vault_grafana_pg_password }}"
      dest: "{{ docker_base_path }}/secrets/grafana_pg_password"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Grafana - Write smtp_password secret
    copy:
      content: "{{ vault_smtp_server_password }}"
      dest: "{{ docker_base_path }}/secrets/smtp_password"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Grafana - Write configuration
    template:
      src: grafana/grafana_ini.j2
      dest: "{{ docker.paths.configs }}grafana/grafana.ini"
      mode: 0644
      backup: yes
    register: grafana_config
  - name: Grafana - Create provisioning directories
    file:
      path: "{{ docker.paths.configs }}grafana/provisioning/{{ item }}"
      state: directory
      mode: '0755'
      owner: '472'
      group: '0'
    become: yes
    loop:
      - datasources
      - dashboards
      # Unused, but Grafana logs an error on every start when they are missing.
      - plugins
      - alerting
  - name: Grafana - Remove datasource provisioning file (conflicts with existing DB datasource)
    file:
      path: "{{ docker.paths.configs }}grafana/provisioning/datasources/prometheus.yml"
      state: absent
    become: yes
  - name: Grafana - Write Loki datasource provisioning
    template:
      src: grafana/provisioning/datasources/loki.yml.j2
      dest: "{{ docker.paths.configs }}grafana/provisioning/datasources/loki.yml"
      mode: '0644'
      owner: '472'
      group: '0'
    become: yes
  - name: Grafana - Write Alertmanager datasource provisioning
    template:
      src: grafana/provisioning/datasources/alertmanager.yml.j2
      dest: "{{ docker.paths.configs }}grafana/provisioning/datasources/alertmanager.yml"
      mode: '0644'
      owner: '472'
      group: '0'
    become: yes
    register: grafana_alertmanager_datasource
  # The dashboard provider and files, and the go-e datasource of the vehicle
  # control dashboard, are written by grafana_dashboards.yml, imported from
  # main.yml so they can be deployed on their own.
  - name: Grafana - Change permissions for data dir (top level only)
    file:
      path: "{{ docker.paths.data }}grafana"
      mode: '0755'
      owner: '472'
      group: '0'
      recurse: no
    become: yes
  # Older images ran as nobody, which still owned these. Grafana 13 fails to
  # start when it cannot write its search index (unified-search), and it
  # cannot update its bundled app plugins without owning them.
  - name: Grafana - Own the data subdirectories
    file:
      path: "{{ docker.paths.data }}grafana/{{ item }}"
      state: directory
      owner: '472'
      group: '0'
      recurse: yes
    become: yes
    loop:
      - alerting
      - csv
      - pdf
      - plugins
      - png
      - unified-search
  - name: Grafana - Change permissions for logs dir
    file:
      path: "{{ docker.paths.logs }}grafana"
      mode: '0755'
      owner: '472'
      group: '0'
    become: yes
  - name: Grafana - Ensure postgres data dir exists with correct postgres ownership
    file:
      path: "{{ docker.paths.data }}grafana/postgres"
      state: directory
      mode: '0700'
      owner: '70'
      group: '70'
      recurse: yes
    become: yes