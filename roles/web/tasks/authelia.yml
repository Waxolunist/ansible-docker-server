---
  - name: Authelia - Write configuration
    template:
      src: authelia/authelia_yml.j2
      dest: "{{ docker.paths.configs }}authelia/configuration.yml"
      mode: 0644
      backup: yes
    register: authelia_config
  # The users database belongs to Authelia (password resets) and to
  # scripts/authelia_user.sh. Ansible only creates its directory and never
  # writes the file. data/authelia is owned by nobody, hence become.
  - name: Authelia - Create users database directory
    file:
      path: "{{ docker.paths.data }}authelia/users"
      state: directory
      mode: 0700
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
    become: yes
  # One-time move of the database Ansible used to render from the vault into
  # the config directory. Skipped once moved, and never overwrites.
  - name: Authelia - Find the users database rendered by older playbook runs
    find:
      paths: "{{ docker.paths.configs }}authelia"
      patterns: "users_database.yml*"
    register: authelia_old_users
  - name: Authelia - Move the users database into the data directory
    copy:
      src: "{{ docker.paths.configs }}authelia/users_database.yml"
      dest: "{{ docker.paths.data }}authelia/users/users_database.yml"
      remote_src: yes
      force: no
      mode: 0600
    when: "docker.paths.configs + 'authelia/users_database.yml' in authelia_old_users.files | map(attribute='path') | list"
  # Including the Ansible backup copies, which hold old password hashes.
  - name: Authelia - Remove the old users database and its backups
    file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ authelia_old_users.files }}"
    loop_control:
      label: "{{ item.path }}"
  - name: Authelia - Check that a users database exists
    stat:
      path: "{{ docker.paths.data }}authelia/users/users_database.yml"
    register: authelia_users_db
  - name: Authelia - Warn about a missing users database
    debug:
      msg: >-
        {{ docker.paths.data }}authelia/users/users_database.yml does not exist,
        so Authelia will not start. Restore the latest
        /backup/authelia_users_*.yml there, or create the first user with
        scripts/authelia_user.sh add.
    when: not authelia_users_db.stat.exists
  - name: Authelia - Write jwt_secret secret
    copy:
      content: "{{ vault_authelia_jwt_secret }}"
      dest: "{{ docker_base_path }}/secrets/authelia_jwt_secret"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Authelia - Write session_secret secret
    copy:
      content: "{{ vault_authelia_session_secret }}"
      dest: "{{ docker_base_path }}/secrets/authelia_session_secret"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Authelia - Write storage_encryption_key secret
    copy:
      content: "{{ vault_authelia_storage_encryption_key }}"
      dest: "{{ docker_base_path }}/secrets/authelia_storage_encryption_key"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  # A new Authelia version migrates the SQLite schema on first start, and an
  # older version refuses to open a migrated database. Keep a copy taken
  # under the old version so a rollback is possible.
  - name: Authelia - Read the image of the running container
    command: docker inspect authelia
    become: yes
    register: authelia_inspect
    changed_when: false
    failed_when: false
  - name: Authelia - Snapshot the database before an image change
    copy:
      src: "{{ docker.paths.data }}authelia/db.sqlite3"
      # Named after the version that can still open it.
      dest: "/backup/authelia_db_{{ (authelia_inspect.stdout | from_json)[0].Config.Image | regex_replace('^.*:', '') }}_{{ ansible_date_time.iso8601_basic_short }}.sqlite3"
      remote_src: yes
      mode: 0600
    become: yes
    when:
      - authelia_inspect.rc == 0
      - (authelia_inspect.stdout | from_json)[0].Config.Image != authelia.image
  - name: Touch sqlite db
    file:
      path: "{{ docker.paths.data }}authelia/db.sqlite3"
      state: touch
      mode: 0644
      modification_time: preserve
      access_time: preserve