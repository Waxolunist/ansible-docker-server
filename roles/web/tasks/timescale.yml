---
  - name: Timescale - Change permissions for work dir
    file:
      path: "{{ docker.paths.data }}timescale"
      mode: '0755'
  - name: Timescale - Change permissions for logs dir
    file:
      path: "{{ docker.paths.logs }}timescale"
      mode: '0755'
  - name: Timescale - Check if pgdata exists
    stat: 
      path: "{{ docker.paths.data }}timescale/pgdata"
    register: timescale_pgdata_dir
  - name: Timescale - Create pgdata
    file:
      path: "{{ docker.paths.data }}timescale/pgdata"
      state: directory
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
    when: timescale_pgdata_dir.stat.exists == False
  - name: Timescale - Ensure pgdata ownership is correct
    file:
      path: "{{ docker.paths.data }}timescale/pgdata"
      state: directory
      owner: "1000"
      group: "1000"
      recurse: yes
    become: yes
  - name: Timescale - Write superuser password secret
    copy:
      content: "{{ vault_timescale_pg_password }}"
      dest: "{{ docker_base_path }}/secrets/timescale_superuser_password"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Timescale - Write role init SQL
    template:
      src: timescale/init_roles_sql.j2
      dest: "{{ docker.paths.configs }}timescale/init_roles.sql"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Timescale - Write monitoring init SQL
    # Runs automatically for new databases (docker-entrypoint-initdb.d).
    # For existing databases: connect as superuser and run
    #   psql -h localhost -U <superuser> -d timescale_home \
    #        -f /var/docker/configs/timescale/monitoring.sql
    template:
      src: timescale/monitoring_sql.j2
      dest: "{{ docker.paths.configs }}timescale/monitoring.sql"
      mode: '0644'
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
  - name: Timescale - Drop the catch-all pg_hba rule
    lineinfile:
      path: "{{ docker.paths.data }}timescale/pgdata/pg_hba.conf"
      regexp: '^host\s+all\s+all\s+all\s+scram-sha-256'
      state: absent
    become: yes
    notify: reload timescale
  - name: Timescale - Allow the Docker networks and the WireGuard peers
    lineinfile:
      path: "{{ docker.paths.data }}timescale/pgdata/pg_hba.conf"
      line: "host all all {{ item }} scram-sha-256"
    loop:
      - samenet
      - "{{ wireguard.network }}"
    become: yes
    notify: reload timescale
  - name: Timescale - Set the time zones
    lineinfile:
      path: "{{ docker.paths.data }}timescale/pgdata/postgresql.conf"
      regexp: '^{{ item.name }}\s*='
      line: "{{ item.name }} = '{{ item.value }}'"
    loop:
      - { name: timezone, value: UTC }
      - { name: log_timezone, value: Europe/Vienna }
    become: yes
    notify: reload timescale
