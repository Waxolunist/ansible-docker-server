---
  # The settings file lives outside /app-data: the image's entrypoint runs
  # chown -R over /app-data, which fails on a read-only bind mount. It is only
  # written by the image when missing, so pointing OTTERWIKI_SETTINGS here
  # keeps the SECRET_KEY in the vault instead of a generated one on disk.
  # Group 33 is www-data inside the container, which uwsgi runs as.
  - name: Otterwiki - Write settings
    template:
      src: otterwiki/settings_cfg.j2
      dest: "{{ docker.paths.configs }}otterwiki/settings.cfg"
      owner: "{{ ansible_user }}"
      group: "33"
      mode: 0640
      backup: yes
    become: yes
    register: otterwiki_config
  - name: Otterwiki - Write the pull script
    copy:
      src: otterwiki_pull.sh
      dest: "{{ docker_base_path }}/otterwiki_pull.sh"
      mode: 0755
  # GitHub's push webhook triggers the pull right away. This hourly pull
  # catches deliveries that failed, e.g. while the server was down; GitHub
  # does not retry them.
  - name: Otterwiki - Pull from GitHub hourly as a fallback
    cron:
      name: "otterwiki pull"
      minute: "17"
      user: "{{ ansible_user }}"
      job: "{{ docker_base_path }}/otterwiki_pull.sh >> {{ docker.paths.logs }}otterwiki_pull.log 2>&1"
