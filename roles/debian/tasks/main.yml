---
- name: Upgrade system
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      retries: 5
      delay: 10
      register: apt_cache_update
      until: apt_cache_update is succeeded
    - name: Upgrade system packages
      apt:
        upgrade: dist
        update_cache: no
    - name: Copy bashrc
      template:
        src: bashrc.j2
        dest: .bashrc
        mode: 0644
        backup: yes
    - name: Copy bash_aliases
      template:
        src: bash_aliases.j2
        dest: .bash_aliases
        mode: 0644
        backup: yes
    - name: Install helpful tools
      apt:
        name:
          - bash-completion
          - colorized-logs
          - cron
          - rsync
        update_cache: no
    - name: Install python
      apt:
        name:
          - python3
          - python3-pip
          - python3-setuptools
        state: latest
        update_cache: no
    - name: Test alternatives
      command: update-alternatives --list python
      register: python_alternatives
      changed_when: False
      ignore_errors: yes
    - name: Install alternatives 3
      command:
        cmd: update-alternatives --install /usr/bin/python python /usr/bin/python3 2
      when: python_alternatives.stderr is search("no alternatives for python")
    - name: Install alternative
      command: 
        cmd: update-alternatives --install /usr/bin/python python /usr/bin/python3 2
      when: python_alternatives is succeeded and python_alternatives.stdout is not search("/usr/bin/python3")
    - name: Set default python version
      alternatives:
        name: python
        path: /usr/bin/python3
    - name: Remove dependencies that are no longer required
      apt:
        autoremove: yes
        update_cache: no
    - name: Check swap file
      stat:
        path: "{{ swap_file }}"
      register: swap_file_stat
    - name: Create swap file
      command: "fallocate -l {{ swap_size }} {{ swap_file }}"
      when: not swap_file_stat.stat.exists
    - name: Restrict swap file permissions
      file:
        path: "{{ swap_file }}"
        owner: root
        group: root
        mode: 0600
    - name: Format swap file
      command: "mkswap {{ swap_file }}"
      when: not swap_file_stat.stat.exists
    - name: Register swap file in fstab
      ansible.posix.mount:
        src: "{{ swap_file }}"
        path: none
        fstype: swap
        opts: sw,pri=-2
        state: present
    - name: Enable swap
      command: "swapon {{ swap_file }}"
      when: ansible_facts['swaptotal_mb'] == 0
    - name: Set swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ swap_swappiness }}"
        sysctl_file: /etc/sysctl.d/99-swap.conf
        state: present
    - name: Create backup folder
      file:
        path: "/backup"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
  become: yes
  