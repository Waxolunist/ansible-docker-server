---
  - hosts: web
    become: true
    tasks:
      - name: Harden SSH - AllowUsers
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^AllowUsers'
          line: "AllowUsers devops"
          state: present
          backup: yes

      - name: Harden SSH - ClientAliveInterval
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^ClientAliveInterval'
          line: "ClientAliveInterval 300"
          state: present

      - name: Harden SSH - ClientAliveCountMax
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^ClientAliveCountMax'
          line: "ClientAliveCountMax 2"
          state: present

      - name: Harden SSH - LoginGraceTime
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^LoginGraceTime'
          line: "LoginGraceTime 30"
          state: present

      - name: Harden SSH - X11Forwarding
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^X11Forwarding'
          line: "X11Forwarding no"
          state: present

      - name: Harden SSH - PermitEmptyPasswords
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^PermitEmptyPasswords'
          line: "PermitEmptyPasswords no"
          state: present

      - name: Harden SSH - MaxAuthTries
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^MaxAuthTries'
          line: "MaxAuthTries 3"
          state: present

      - name: Harden SSH - Ciphers
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^Ciphers'
          line: "Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr"
          state: present

      - name: Harden SSH - MACs
        lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^MACs'
          line: "MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com"
          state: present
        notify: restart sshd

      # sshd keeps the first value it reads, and sshd_config includes
      # sshd_config.d/*.conf before its own lines. The provider's
      # 50-cloud-init.conf sets PasswordAuthentication yes, which overrode the
      # "no" the system role writes to sshd_config. 00- sorts before it.
      - name: Harden SSH - Disable password authentication ahead of cloud-init
        copy:
          dest: /etc/ssh/sshd_config.d/00-hardening.conf
          content: |
            # Managed by Ansible (hardening.yml)
            PasswordAuthentication no
            DebianBanner no
          mode: "0644"
          validate: /usr/sbin/sshd -t -f %s
        notify: restart sshd

      # --- fail2ban ---

      - name: Install fail2ban
        apt:
          name: fail2ban
          state: present
          update_cache: yes
          cache_valid_time: 3600

      - name: Configure fail2ban SSH jail
        copy:
          dest: /etc/fail2ban/jail.d/sshd.conf
          content: |
            [sshd]
            enabled = true
            port = ssh
            filter = sshd[mode=aggressive]
            backend = systemd
            # SSH over TLS on 443 reaches sshd from Traefik's address on
            # web_proxy (roles/web/vars/main.yml, ssh_tunnel). Banning it would
            # block that route for everyone, and with password login off
            # there is nothing to guess.
            ignoreip = 127.0.0.1/8 ::1 172.20.0.0/24
            maxretry = 3
            findtime = 600
            bantime = 3600
            bantime.increment = true
            bantime.maxtime = 1w
          mode: "0644"
        notify: restart fail2ban

      - name: Remove the disabled fail2ban Traefik jail
        file:
          path: "{{ item }}"
          state: absent
        loop:
          - /etc/fail2ban/jail.d/traefik.conf
          - /etc/fail2ban/filter.d/traefik-auth.conf
        notify: restart fail2ban

      - name: Create the Authelia log directory
        file:
          path: /var/docker/logs/authelia
          state: directory
          owner: "{{ ansible_user }}"
          group: "{{ ansible_user }}"

      - name: Create the Authelia log file watched by fail2ban
        file:
          path: /var/docker/logs/authelia/authelia.log
          state: touch
          owner: "{{ ansible_user }}"
          group: "{{ ansible_user }}"
          mode: "0644"
          modification_time: preserve
          access_time: preserve

      - name: Create fail2ban filter for Authelia login failures
        copy:
          dest: /etc/fail2ban/filter.d/authelia.conf
          content: |
            [Definition]
            failregex = ^\s*level=error msg="Unsuccessful \S+ authentication attempt by user '.*'".* remote_ip=<HOST>(?:\s|$)
            ignoreregex =
            datepattern = ^time="%%Y-%%m-%%dT%%H:%%M:%%S%%z"
          mode: "0644"
        notify: restart fail2ban

      - name: Configure fail2ban Authelia jail
        copy:
          dest: /etc/fail2ban/jail.d/authelia.conf
          content: |
            [authelia]
            enabled = true
            filter = authelia
            backend = auto
            logpath = /var/docker/logs/authelia/authelia.log
            port = http,https
            banaction = iptables-multiport
            chain = DOCKER-USER
            ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.8.0.0/24
            maxretry = 5
            findtime = 600
            bantime = 3600
          mode: "0644"
        notify: restart fail2ban

      - name: Create fail2ban filter for scanner requests through Traefik
        copy:
          dest: /etc/fail2ban/filter.d/traefik-scan.conf
          content: |
            [Definition]
            failregex = ^\{.*"ClientHost":"<HOST>".*"RequestPath":"[^"?]*(?:/\.env|/\.git/|/\.aws/|/\.ssh/|/\.config/gcloud/|phpinfo\.php|/wp-login\.php|/wp-admin/|/xmlrpc\.php|credentials\.json)
            ignoreregex =
            datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"
          mode: "0644"
        notify: restart fail2ban

      - name: Configure fail2ban Traefik scanner jail
        copy:
          dest: /etc/fail2ban/jail.d/traefik-scan.conf
          content: |
            [traefik-scan]
            enabled = true
            filter = traefik-scan
            backend = auto
            logpath = /var/docker/logs/traefik/access.log
            port = http,https
            banaction = iptables-multiport
            chain = DOCKER-USER
            ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.8.0.0/24
            maxretry = 3
            findtime = 600
            bantime = 3600
            bantime.increment = true
            bantime.maxtime = 1w
          mode: "0644"
        notify: restart fail2ban

      - name: Create fail2ban filter for requests to the bare IP address
        copy:
          dest: /etc/fail2ban/filter.d/traefik-bare-ip.conf
          content: |
            [Definition]
            failregex = ^\{.*"ClientHost":"<HOST>".*"RequestHost":"(?:\d{1,3}(?:\.\d{1,3}){3}|\[?[0-9a-fA-F]*:[0-9a-fA-F:]*\]?)"
            ignoreregex =
            datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"
          mode: "0644"
        notify: restart fail2ban

      - name: Configure fail2ban Traefik bare IP jail
        copy:
          dest: /etc/fail2ban/jail.d/traefik-bare-ip.conf
          content: |
            [traefik-bare-ip]
            enabled = true
            filter = traefik-bare-ip
            backend = auto
            logpath = /var/docker/logs/traefik/access.log
            port = http,https
            banaction = iptables-multiport
            chain = DOCKER-USER
            ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.8.0.0/24
            maxretry = 1
            findtime = 600
            bantime = 86400
            bantime.increment = true
            bantime.maxtime = 4w
          mode: "0644"
        notify: restart fail2ban

      - name: Enable and start fail2ban
        ansible.builtin.systemd:
          name: fail2ban
          state: started
          enabled: true

      - name: Install the GeoIP reader
        apt:
          name: python3-maxminddb
          state: present

      - name: Install the GeoIP database updater
        copy:
          src: files/geoip_update.sh
          dest: /usr/local/sbin/geoip-update
          owner: root
          group: root
          mode: "0755"

      - name: Install the GeoIP update service and timer
        copy:
          dest: "/etc/systemd/system/{{ item.name }}"
          content: "{{ item.content }}"
          mode: "0644"
        loop:
          - name: geoip-update.service
            content: |
              [Unit]
              Description=Download the DB-IP City Lite database
              Wants=network-online.target
              After=network-online.target

              [Service]
              Type=oneshot
              ExecStart=/usr/local/sbin/geoip-update /var/lib/geoip/dbip-city-lite.mmdb
          - name: geoip-update.timer
            content: |
              [Unit]
              Description=Download the DB-IP City Lite database monthly

              [Timer]
              OnCalendar=*-*-03 04:00
              RandomizedDelaySec=2h
              Persistent=true

              [Install]
              WantedBy=timers.target
        loop_control:
          label: "{{ item.name }}"
        notify: reload systemd

      - name: Download the GeoIP database if it is missing
        command: /usr/local/sbin/geoip-update /var/lib/geoip/dbip-city-lite.mmdb
        args:
          creates: /var/lib/geoip/dbip-city-lite.mmdb

      - name: Install the fail2ban metrics script
        copy:
          src: files/fail2ban_metrics.py
          dest: /usr/local/sbin/fail2ban-metrics
          owner: root
          group: root
          mode: "0755"

      - name: Install the fail2ban metrics service
        copy:
          dest: /etc/systemd/system/fail2ban-metrics.service
          content: |
            [Unit]
            Description=Write fail2ban bans for the node-exporter textfile collector
            After=fail2ban.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/fail2ban-metrics /var/docker/data/node-exporter /var/lib/geoip/dbip-city-lite.mmdb
          mode: "0644"
        notify: reload systemd

      - name: Install the fail2ban metrics timer
        copy:
          dest: /etc/systemd/system/fail2ban-metrics.timer
          content: |
            [Unit]
            Description=Write fail2ban metrics every minute

            [Timer]
            OnBootSec=1min
            OnUnitActiveSec=1min
            AccuracySec=5s

            [Install]
            WantedBy=timers.target
          mode: "0644"
        notify: reload systemd

      - name: Flush handlers so systemd knows the metrics units
        meta: flush_handlers

      - name: Enable and start the fail2ban metrics and GeoIP timers
        ansible.builtin.systemd:
          name: "{{ item }}"
          state: started
          enabled: true
        loop: [fail2ban-metrics.timer, geoip-update.timer]

      # --- Automated security updates ---

      - name: Install unattended-upgrades
        apt:
          name:
            - unattended-upgrades
            - apt-listchanges
          state: present
          update_cache: yes
          cache_valid_time: 3600

      - name: Configure unattended-upgrades
        copy:
          dest: /etc/apt/apt.conf.d/50unattended-upgrades
          content: |
            Unattended-Upgrade::Origins-Pattern {
                "origin=Debian,codename=${distro_codename},label=Debian-Security";
                "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
            };
            Unattended-Upgrade::Package-Blacklist {
            };
            Unattended-Upgrade::AutoFixInterruptedDpkg "true";
            Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
            Unattended-Upgrade::Remove-Unused-Dependencies "true";
            Unattended-Upgrade::Automatic-Reboot "false";
            Unattended-Upgrade::SyslogEnable "true";
          mode: "0644"

      - name: Enable automatic update checks
        copy:
          dest: /etc/apt/apt.conf.d/20auto-upgrades
          content: |
            APT::Periodic::Update-Package-Lists "1";
            APT::Periodic::Unattended-Upgrade "1";
            APT::Periodic::AutocleanInterval "7";
          mode: "0644"

    handlers:
      - name: restart sshd
        service:
          name: sshd
          state: restarted

      - name: restart fail2ban
        ansible.builtin.systemd:
          name: fail2ban
          state: restarted

      - name: reload systemd
        ansible.builtin.systemd:
          daemon_reload: true
